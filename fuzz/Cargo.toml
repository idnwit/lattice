[package]
name = "lattice-fuzz"
description = "cargo-fuzz targets (.rules/verification.md, CI: nightly, outside ci-ok)."
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lattice-proc-ipc = { path = "../crates/lattice-proc-ipc" }

# Not a workspace member: it needs nightly and libFuzzer.
[workspace]

[[bin]]
name = "proc_ipc_decode"
path = "fuzz_targets/proc_ipc_decode.rs"
test = false
doc = false
bench = false
