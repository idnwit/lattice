[[brick]]
name = "key"
members = ["path:crates/lattice-key/"]
tags = ["base"]
desc = "NodeId and node key (ed25519): sign, verify, encode. No I/O"

[[brick]]
name = "proc-ipc"
members = ["path:crates/lattice-proc-ipc/"]
tags = ["frozen"]
desc = "latticed <-> latticed-proc TLV codec and v1 messages. Frozen v1"

[[brick]]
name = "transport"
members = ["path:crates/lattice-transport/"]
tags = ["contract"]
desc = "Transport and Conn traits, PathInfo, path-selection FSM (sans-IO)"

[[brick]]
name = "relay-proto"
members = ["path:crates/lattice-relay-proto/"]
tags = ["contract"]
desc = "Relay UDP wire codec, token table, relay engine and client registration FSM (sans-IO)"

[[brick]]
name = "sync-proto"
members = ["path:crates/lattice-sync-proto/"]
tags = ["contract"]
desc = "Node-to-node sync wire messages (02-sync: Hello, Subscribe, Change, Action) and stream framing (sans-IO)"

[[brick]]
name = "quic"
members = ["path:crates/lattice-quic/"]
tags = ["adapter"]
desc = "Magic socket (relay | direct under one virtual address) + quinn; implements Transport"

[[brick]]
name = "worker"
members = ["path:crates/lattice-worker/"]
tags = ["host"]
desc = "Worker host: proc daemon client, journals, apps runner (one runner per instance), state streams, serves deck connections"

[[brick]]
name = "deck-core"
members = ["path:crates/lattice-deck-core/"]
tags = ["host"]
desc = "Deck host: worker links, sessions and panes model, instance states (apply deltas), create/close/kill actions. No UI"

[[brick]]
name = "latticed-proc"
members = ["path:crates/latticed-proc/"]
tags = ["proc"]
desc = "Frozen process daemon: PTYs, children, per-instance journals, IPC server. Sync, poll-based"

[[brick]]
name = "latticed"
members = ["path:crates/latticed/"]
tags = ["bin"]
desc = "Worker connectivity daemon: wires quic + worker host"

[[brick]]
name = "relay"
members = ["path:crates/lattice-relay/"]
tags = ["relay"]
desc = "Public UDP relay: forwards ciphertext, never decrypts"

[[brick]]
name = "deck"
members = ["path:crates/lattice-deck/"]
tags = ["bin"]
desc = "Deck app (macOS, iOS) on NSH: ui module (NSH views from props + tokens.json), wiring deck-core + quic"

[[brick]]
name = "cli"
members = ["lattice"]
tags = ["bin"]
desc = "lattice CLI (pair, session, lattice-hook). Placeholder in layer 1"

[[brick]]
name = "state"
members = ["path:crates/lattice-state/"]
tags = ["base"]
desc = "App SDK: synced types (Value, Map, List, Synced trait), draft/commit/rollback/apply, revisions. Copied from realtime-workspace rtf-core. No I/O"

[[brick]]
name = "state-macros"
members = ["path:crates/lattice-state-macros/"]
tags = ["base"]
desc = "Proc macro #[derive(Synced)] for app state structs. Copied from realtime-workspace rtf-macros"

[[brick]]
name = "app"
members = ["path:crates/lattice-app/"]
tags = ["contract"]
desc = "App contract (06-apps): App trait, Ctx effects, instance ids and records, worker/apps actions. Sans-IO"

[[brick]]
name = "app-terminal"
members = ["path:apps/terminal/"]
tags = ["app"]
desc = "Built-in terminal app (apps/terminal): vt100 emulator in the runner, TermState synced. Builds to a WASM runner package"

[[brick]]
name = "app-macros"
members = ["path:crates/lattice-app-macros/"]
tags = ["base"]
desc = "Proc macro #[lattice::interface]: action enum, runner adapter, typed client (D36). Ported from realtime-workspace rtf-macros"

[[brick]]
name = "deck-ui"
members = ["path:crates/lattice-deck-ui/"]
tags = ["ui"]
desc = "Deck UI library on NSH: tokens, components, workspace (tabs, splits, app picker), desktop and mobile layouts. examples/ show the wiring (D39, D42)"

[[brick]]
name = "app-echo"
members = ["path:apps/echo/"]
tags = ["app"]
desc = "Built-in echo app (apps/echo): no process; runner keeps sent lines (D40). Builds to a WASM runner package"

[[brick]]
name = "app-guest"
members = ["path:crates/lattice-app-guest/"]
tags = ["contract"]
desc = "WASM guest glue for app runners (ABI v0, D43): export_runner! and the alloc/init/step/snapshot exports. Second crate allowed unsafe"

[[brick]]
name = "wasm"
members = ["path:crates/lattice-wasm/"]
tags = ["adapter"]
desc = "WASM host for app runners (wasmtime, ABI v0, D43): loads a runner package and drives it as a DynRunner. No imports, memory and fuel caps"

[[brick]]
name = "package"
members = ["path:crates/lattice-package/"]
tags = ["contract"]
desc = "App packages (D44): app.toml manifest and spawn templates, package bytes, blake3 hash and verification"

[[brick]]
name = "builtin-apps"
members = ["path:crates/lattice-builtin-apps/"]
tags = ["contract"]
desc = "Built-in app packages (D44): build.rs builds apps/* to wasm, packs them with app.toml, embeds them for the deck"

