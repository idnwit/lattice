[[brick]]
name = "key"
members = ["path:crates/lattice-key/"]
tags = ["base"]
desc = "NodeId and node key (ed25519): sign, verify, encode. No I/O"

[[brick]]
name = "proc-ipc"
members = ["path:crates/lattice-proc-ipc/"]
tags = ["frozen"]
desc = "latticed <-> latticed-proc TLV codec and v1 messages. Frozen v1"

[[brick]]
name = "transport"
members = ["path:crates/lattice-transport/"]
tags = ["contract"]
desc = "Transport and Conn traits, PathInfo, path-selection FSM (sans-IO)"

[[brick]]
name = "relay-proto"
members = ["path:crates/lattice-relay-proto/"]
tags = ["contract"]
desc = "Relay UDP wire codec, token table, relay engine and client registration FSM (sans-IO)"

[[brick]]
name = "sync-proto"
members = ["path:crates/lattice-sync-proto/"]
tags = ["contract"]
desc = "Node-to-node sync wire messages (02-sync: Hello, Subscribe, Change, Action) and stream framing (sans-IO)"

[[brick]]
name = "quic"
members = ["path:crates/lattice-quic/"]
tags = ["adapter"]
desc = "Magic socket (relay | direct under one virtual address) + quinn; implements Transport"

[[brick]]
name = "worker"
members = ["path:crates/lattice-worker/"]
tags = ["host"]
desc = "Worker host: proc daemon client, process streams, serves deck connections"

[[brick]]
name = "deck-core"
members = ["path:crates/lattice-deck-core/"]
tags = ["host"]
desc = "Deck host: worker links, sessions and panes model, input actions. No UI"

[[brick]]
name = "latticed-proc"
members = ["path:crates/latticed-proc/"]
tags = ["proc"]
desc = "Frozen process daemon: PTYs, children, ring buffer, IPC server. Sync, poll-based"

[[brick]]
name = "latticed"
members = ["path:crates/latticed/"]
tags = ["bin"]
desc = "Worker connectivity daemon: wires quic + worker host"

[[brick]]
name = "relay"
members = ["path:crates/lattice-relay/"]
tags = ["relay"]
desc = "Public UDP relay: forwards ciphertext, never decrypts"

[[brick]]
name = "deck"
members = ["path:crates/lattice-deck/"]
tags = ["bin"]
desc = "Deck app (macOS, iOS) on NSH: ui module (NSH views from props + tokens.json), wiring deck-core + quic"

[[brick]]
name = "cli"
members = ["lattice"]
tags = ["bin"]
desc = "lattice CLI (pair, session, lattice-hook). Placeholder in layer 1"

[[rule]]
from = "tag:bin"
to = "tag:adapter"
reason = "binaries pick the concrete I/O"

[[rule]]
from = "tag:bin"
to = "tag:contract"
reason = "binaries build configs and ids for hosts"

[[rule]]
from = "tag:bin"
to = "tag:base"
reason = "binaries load node keys"

[[rule]]
from = "tag:host"
to = "tag:contract"
reason = "hosts speak the wire contracts"

[[rule]]
from = "tag:host"
to = "tag:base"
reason = "hosts name nodes"

[[rule]]
from = "tag:adapter"
to = "tag:contract"
reason = "adapters implement contract traits"

[[rule]]
from = "tag:adapter"
to = "tag:base"
reason = "adapters sign and verify with node keys"

[[rule]]
from = "tag:contract"
to = "tag:base"
reason = "contracts carry NodeId"

[[rule]]
from = "latticed-proc"
to = "proc-ipc"
reason = "frozen daemon reaches only proc-ipc, rustix, std (forbidden edges)"

[[rule]]
from = "relay"
to = "relay-proto"
reason = "relay runs the sans-IO relay engine"

[[rule]]
from = "relay"
to = "key"
reason = "relay verifies REGISTER signatures; never sync or identity (forbidden edges)"

[[rule]]
from = "worker"
to = "proc-ipc"
reason = "only the worker host speaks proc IPC v1 (trust boundary)"

[[rule]]
from = "latticed"
to = "worker"
reason = "the worker daemon runs the worker host, never the deck host"

[[rule]]
from = "deck"
to = "deck-core"
reason = "the deck app runs the deck host, never the worker host"

