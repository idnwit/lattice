[package]
name = "lattice"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Peer-to-peer terminal: workers run processes, decks show and steer them."
repository = "https://github.com/idnwit/lattice"
publish = false

[dependencies]

# Base lint set from .rules/engineering.md. Moves to [workspace.lints] at the split.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
let_underscore_must_use = "deny"
large_futures = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "deny"
