[package]
name = "lattice-deck-ui"
description = "Deck UI library on NSH: tokens, components, desktop and mobile layouts, viewer contract (D39)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# NSH pure-Rust mode. No default features on nsh crates: the defaults pull the JS host.
nsh-core = "=0.7.0"
tracing.workspace = true

[build-dependencies]
# Reads docs/design-system/tokens.json into the generated `tokens` module.
serde_json = "1"

[dev-dependencies]
nsh-engine = { version = "=0.7.0", default-features = false }
nsh-testing = { version = "=0.7.0", default-features = false }

# The gallery example opens a native window (macOS only).
[target.'cfg(target_os = "macos")'.dev-dependencies]
nsh-platform-macos = { version = "=0.7.0", default-features = false }

[lints]
workspace = true
