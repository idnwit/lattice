[package]
name = "lattice"
description = "Peer-to-peer terminal: workers run processes, decks show and steer them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
lattice-app.workspace = true
lattice-app-echo = { workspace = true, default-features = false, features = ["viewer"] }
lattice-app-terminal = { workspace = true, default-features = false, features = ["viewer"] }
lattice-builtin-apps.workspace = true
lattice-deck-core.workspace = true
lattice-key.workspace = true
lattice-quic.workspace = true
lattice-state.workspace = true
# `lattice attach`: raw mode and window size of the local TTY (safe termios API).
rustix.workspace = true
# `signal`: SIGWINCH for `lattice attach`; `io-std`, `io-util`: its screen output.
tokio = { workspace = true, features = ["signal", "io-std", "io-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
