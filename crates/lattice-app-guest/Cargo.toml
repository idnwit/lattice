[package]
name = "lattice-app-guest"
description = "WASM guest glue for app runners and viewers (ABI v0, D43): export_runner!, export_viewer!."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lattice-app.workspace = true
lattice-state.workspace = true
serde.workspace = true

# Keep in sync with [workspace.lints] in the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
let_underscore_must_use = "deny"
large_futures = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "deny"
