[package]
name = "lattice-deck"
description = "Lattice deck app: the native control center UI, built with NSH."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lattice-deck-core.workspace = true
# NSH pure-Rust mode. No default features on nsh crates: the defaults pull the JS host.
nsh-core = "=0.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.7.0", default-features = false }

[build-dependencies]
# Reads docs/design-system/tokens.json into the generated `ui::tokens` module.
serde_json = "1"

[dev-dependencies]
nsh-engine = { version = "=0.7.0", default-features = false }
nsh-testing = { version = "=0.7.0", default-features = false }

[lints]
workspace = true
