[package]
name = "lattice-deck"
description = "Lattice deck app: the native control center UI, built with NSH."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lattice-app.workspace = true
lattice-builtin-apps.workspace = true
lattice-deck-core.workspace = true
lattice-deck-ui.workspace = true
lattice-key.workspace = true
lattice-package.workspace = true
lattice-quic.workspace = true
lattice-state.workspace = true
lattice-sync-proto.workspace = true
lattice-transport.workspace = true
lattice-wasm.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
# NSH pure-Rust mode. No default features on nsh crates: the defaults pull the JS host.
nsh-core = "=0.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.7.0", default-features = false }

[dev-dependencies]
nsh-engine = { version = "=0.7.0", default-features = false }
nsh-testing = { version = "=0.7.0", default-features = false }

[lints]
workspace = true
