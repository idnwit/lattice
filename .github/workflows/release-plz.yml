name: Release-plz

on:
  push:
    branches: [main]

# Uses only GITHUB_TOKEN. Requires org + repo setting
# "Allow GitHub Actions to create and approve pull requests".
#
# Events created with GITHUB_TOKEN do not start other workflows, except
# workflow_dispatch. After opening/updating the release PR, this workflow
# dispatches the real required checks (CI, PR title, commits) on the PR branch.
# Tags and releases made by the release job also do not start workflows, so the
# job dispatches release-artifacts.yml for each new tag.

jobs:
  release-plz-release:
    name: Release-plz release
    if: ${{ github.repository_owner == 'idnwit' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the release artifacts
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          # One workspace version, so usually one tag; dedupe in case several crates list it.
          for tag in $(jq -r '.[].tag' <<<"$RELEASES" | sort -u); do
            gh workflow run release-artifacts.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$tag"
            echo "Dispatched release artifacts for $tag."
          done

  release-plz-pr:
    name: Release-plz PR
    if: ${{ github.repository_owner == 'idnwit' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run required checks on the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch=$(jq -r '.head_branch // empty' <<<"${PR:-{\}}")
          number=$(jq -r '.number // empty' <<<"${PR:-{\}}")
          if [ -z "$branch" ] || [ -z "$number" ]; then
            echo "No release PR opened or updated."
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run conventional.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f pr="$number"
          echo "Dispatched CI and conventional checks for #$number ($branch)."
