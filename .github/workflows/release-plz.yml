name: Release-plz

on:
  push:
    branches: [main]

# Uses only GITHUB_TOKEN. Requires org + repo setting
# "Allow GitHub Actions to create and approve pull requests".
#
# Events created with GITHUB_TOKEN do not start other workflows, except
# workflow_dispatch. After opening/updating the release PR, this workflow
# dispatches the real required checks (CI and PR title) on the PR branch.
# Tags pushed by the release job also do not start workflows; build release
# artifacts inside the release job (`releases_created`) if needed.

jobs:
  release-plz-release:
    name: Release-plz release
    if: ${{ github.repository_owner == 'idnwit' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    if: ${{ github.repository_owner == 'idnwit' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run required checks on the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch=$(jq -r '.head_branch // empty' <<<"${PR:-{\}}")
          number=$(jq -r '.number // empty' <<<"${PR:-{\}}")
          if [ -z "$branch" ] || [ -z "$number" ]; then
            echo "No release PR opened or updated."
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run pr-title.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f pr="$number"
          echo "Dispatched CI and PR-title checks for #$number ($branch)."
